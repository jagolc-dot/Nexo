<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{--color-primario:#A9705F;--color-acento:#C9A227;--color-secundario:#8A9A7B;--color-fondo:#FDF6F3;--color-superficie:#FFFFFF;--color-texto:#4A322B;--color-texto-suave:#8A6A5E;--estado-exito:#2F9E5B;--estado-advertencia:#D9A441;--estado-error:#C1443A;--fuente-cuerpo:'Inter',system-ui,sans-serif;--fuente-titulos:'Playfair Display',Georgia,serif}
body{margin:0;background:var(--color-fondo)}
a{color:var(--color-primario)}a:hover{color:#8F5A4B}
</style>
</helmet>
<div style="font-family:var(--fuente-cuerpo);color:var(--color-texto);height:100%">
<sc-if value="{{ esEscritorio }}" hint-placeholder-val="{{ true }}">
  <div style="width:232px;min-height:700px;height:100%;background:var(--color-superficie);border-right:1px solid #F1E4DE;display:flex;flex-direction:column;padding:20px 14px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:10px;padding:0 8px">
      <img src="assets/logo.jpeg" alt="Glam Nails by Chio" style="width:40px;height:40px;border-radius:50%;object-fit:cover">
      <div>
        <div style="font-family:var(--fuente-titulos);font-weight:var(--peso-titulos,500);font-size:14.5px;line-height:1.2">Glam Nails</div>
        <div style="font-size:11.5px;color:var(--color-texto-suave)">by Chio</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;margin-top:22px">
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-inicio-w,400);color:var(--nav-inicio-c,var(--color-texto-suave));background:var(--nav-inicio-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path></svg>Inicio</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-agenda-w,400);color:var(--nav-agenda-c,var(--color-texto-suave));background:var(--nav-agenda-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 9.5h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>Agenda</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-clientes-w,400);color:var(--nav-clientes-c,var(--color-texto-suave));background:var(--nav-clientes-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.25"></circle><path d="M3.5 19c.6-3 2.8-4.75 5.5-4.75s4.9 1.75 5.5 4.75"></path><circle cx="16.75" cy="9.75" r="2.5"></circle><path d="M17.6 14.6c1.8.55 2.7 1.85 3.1 3.9"></path></svg>Clientes</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-catalogo-w,400);color:var(--nav-catalogo-c,var(--color-texto-suave));background:var(--nav-catalogo-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6.6L20 13.4a1.8 1.8 0 0 1 0 2.6l-4 4a1.8 1.8 0 0 1-2.6 0L4 10.6z"></path><circle cx="8.3" cy="8.3" r="1.1"></circle></svg>Catálogo</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-ventas-w,400);color:var(--nav-ventas-c,var(--color-texto-suave));background:var(--nav-ventas-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-2.2-1.5-2.05 1.5-2.05-1.5-2.1 1.5z"></path><path d="M9.5 8.5h5"></path><path d="M9.5 12h5"></path></svg>Ventas</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-gastos-w,400);color:var(--nav-gastos-c,var(--color-texto-suave));background:var(--nav-gastos-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="13" rx="2"></rect><path d="M3.5 10.5h17"></path><path d="M15 15h2.5"></path></svg>Gastos</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;font-size:13.5px;font-weight:var(--nav-reportes-w,400);color:var(--nav-reportes-c,var(--color-texto-suave));background:var(--nav-reportes-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"></path><path d="M6 18v-6"></path><path d="M12 18V6.5"></path><path d="M18 18v-9"></path></svg>Reportes</a>
    </div>
    <div style="flex:1"></div>
    <div style="border-top:1px solid #F1E4DE;padding-top:12px;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px">
        <div style="width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--color-primario) 14%, white);color:var(--color-primario);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex:none">C</div>
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:500">Chio</div>
          <div style="font-size:11px;color:var(--color-texto-suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Glam Nails by Chio</div>
        </div>
      </div>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:var(--nav-ajustes-w,400);color:var(--nav-ajustes-c,var(--color-texto-suave));background:var(--nav-ajustes-bg,transparent);text-decoration:none" style-hover="background:#FAF3EF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h16"></path><circle cx="10" cy="7.5" r="2.2"></circle><path d="M4 16.5h16"></path><circle cx="15" cy="16.5" r="2.2"></circle></svg>Ajustes</a>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--color-texto-suave);text-decoration:none" style-hover="background:#FAF3EF"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4.5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H14"></path><path d="M4 12h10"></path><path d="M8 8l-4 4 4 4"></path></svg>Cerrar sesión</a>
    </div>
  </div>
</sc-if>
<sc-if value="{{ esTablet }}" hint-placeholder-val="{{ false }}">
  <div style="width:64px;min-height:700px;height:100%;background:var(--color-superficie);border-right:1px solid #F1E4DE;display:flex;flex-direction:column;align-items:center;padding:16px 0;box-sizing:border-box;gap:4px">
    <img src="assets/logo.jpeg" alt="Glam Nails by Chio" style="width:36px;height:36px;border-radius:50%;object-fit:cover;margin-bottom:14px">
    <a href="#" title="Inicio" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-inicio-c,var(--color-texto-suave));background:var(--nav-inicio-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path></svg></a>
    <a href="#" title="Agenda" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-agenda-c,var(--color-texto-suave));background:var(--nav-agenda-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 9.5h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg></a>
    <a href="#" title="Clientes" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-clientes-c,var(--color-texto-suave));background:var(--nav-clientes-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.25"></circle><path d="M3.5 19c.6-3 2.8-4.75 5.5-4.75s4.9 1.75 5.5 4.75"></path><circle cx="16.75" cy="9.75" r="2.5"></circle><path d="M17.6 14.6c1.8.55 2.7 1.85 3.1 3.9"></path></svg></a>
    <a href="#" title="Catálogo" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-catalogo-c,var(--color-texto-suave));background:var(--nav-catalogo-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6.6L20 13.4a1.8 1.8 0 0 1 0 2.6l-4 4a1.8 1.8 0 0 1-2.6 0L4 10.6z"></path><circle cx="8.3" cy="8.3" r="1.1"></circle></svg></a>
    <a href="#" title="Ventas" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-ventas-c,var(--color-texto-suave));background:var(--nav-ventas-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-2.2-1.5-2.05 1.5-2.05-1.5-2.1 1.5z"></path><path d="M9.5 8.5h5"></path><path d="M9.5 12h5"></path></svg></a>
    <a href="#" title="Gastos" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-gastos-c,var(--color-texto-suave));background:var(--nav-gastos-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6.5" width="17" height="13" rx="2"></rect><path d="M3.5 10.5h17"></path><path d="M15 15h2.5"></path></svg></a>
    <a href="#" title="Reportes" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-reportes-c,var(--color-texto-suave));background:var(--nav-reportes-bg,transparent)" style-hover="background:#FAF3EF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"></path><path d="M6 18v-6"></path><path d="M12 18V6.5"></path><path d="M18 18v-9"></path></svg></a>
    <div style="flex:1"></div>
    <a href="#" title="Ajustes" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--nav-ajustes-c,var(--color-texto-suave));background:var(--nav-ajustes-bg,transparent)" style-hover="background:#FAF3EF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h16"></path><circle cx="10" cy="7.5" r="2.2"></circle><path d="M4 16.5h16"></path><circle cx="15" cy="16.5" r="2.2"></circle></svg></a>
    <div title="Chio" style="width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--color-primario) 14%, white);color:var(--color-primario);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;margin-top:6px">C</div>
  </div>
</sc-if>
<sc-if value="{{ esCelular }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;align-items:center;gap:12px;background:var(--color-superficie);padding:12px 16px;border-bottom:1px solid #F1E4DE">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-texto)" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
    <img src="assets/logo.jpeg" alt="Glam Nails by Chio" style="width:30px;height:30px;border-radius:50%;object-fit:cover">
    <div style="flex:1;font-family:var(--fuente-titulos);font-weight:var(--peso-titulos,500);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Glam Nails <span style="color:var(--color-texto-suave);font-weight:400;font-size:12px">by Chio</span></div>
    <div style="width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--color-primario) 14%, white);color:var(--color-primario);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;flex:none">C</div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:700},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;escritorio&quot;,&quot;tablet&quot;,&quot;celular&quot;],&quot;default&quot;:&quot;escritorio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const f = this.props.formato ?? 'escritorio';
    return { esEscritorio: f === 'escritorio', esTablet: f === 'tablet', esCelular: f === 'celular' };
  }
}
</script>
</body>
</html>
